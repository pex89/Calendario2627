function info(m) {
  const real = state.risultati[m.id];
  const r = real || state.demo[m.id] || null;
  const played = !!r && (Number(r.vintiCasa) || 0) + (Number(r.vintiOspite) || 0) > 0;
  return { ...m, data: r?.data || m.data, r, played };
}

// Classifica generale
function classifica() {
  const rows = Object.fromEntries(SQUADRE.map((t) => [t.id, { id: t.id, pt: 0, g: 0, pd: 0, pp: 0 }]));
  MATCHES.map(info).filter((m) => m.played).forEach((m) => {
    const a = rows[m.casa], b = rows[m.ospite];
    if (!a || !b) return;
    const x = Number(m.r.vintiCasa) || 0, y = Number(m.r.vintiOspite) || 0;
    a.g++; b.g++;
    a.pt += x; a.pp += y; a.pd += x + y;
    b.pt += y; b.pp += x; b.pd += x + y;
  });
  return Object.values(rows).sort((a, b) => b.pt - a.pt || a.g - b.g || TEAM[a.id].nome.localeCompare(TEAM[b.id].nome, "it"));
}

function badge(id, cls = "") {
  const t = TEAM[id];
  if (!t) return "";
  return `<span class="badge ${cls}" style="--c:${esc(t.colore || "#444")}">${esc(t.sigla || t.nome.slice(0, 2))}</span>`;
}
const tname = (id) => `<button class="tname ${id === MIA ? "mine" : ""}" data-team="${esc(id)}">${esc(TEAM[id]?.nome || id)}</button>`;

function matchRow(m) {
  const x = m.r?.vintiCasa, y = m.r?.vintiOspite;
  const mid = m.played
    ? `<div class="m-score"><span class="${x >= y ? "w" : "l"}">${x}</span><i>-</i><span class="${y >= x ? "w" : "l"}">${y}</span></div>`
    : `<div class="m-vs">vs</div>`;
  const apribile = isMia(m) && m.played;
  return `
    <div class="match ${apribile ? "apribile" : ""}" ${apribile ? `data-match="${m.id}" role="button"` : ""}>
      <div class="m-side home">${tname(m.casa)}${badge(m.casa)}</div>
      <div class="m-mid">
        ${mid}
        ${state.user ? `<button class="m-edit" data-edit="${m.id}">${ic("edit", "sm")} ${m.played ? "Modifica" : "Risultato"}</button>` : ""}
      </div>
      <div class="m-side away">${badge(m.ospite)}${tname(m.ospite)}</div>
    </div>`;
}

function mcard(m) {
  let pill = "";
  if (m.played) {
    const pt = m.casa === MIA ? m.r.vintiCasa : m.r.vintiOspite;
    const cls = pt >= 10 ? "V" : "P";
    pill = `<span class="pill p-${cls}">${pt} / 19 PT</span>`;
  }
  const quando = `${ord(m.giornata)} · ${fmtBreve(m.data)}`;
  return `
    <div class="card mcard">
      <div class="mcard-head"><span class="grow">${quando}</span>${pill}</div>
      ${matchRow(m)}
    </div>`;
}

// Vista Mia Squadra
function viewSquadra() {
  const t = TEAM[MIA];
  const ms = MATCHES.filter(isMia).map(info);
  const cl = classifica();
  const pos = cl.findIndex((r) => r.id === MIA) + 1;
  const row = cl[pos - 1] || { pt: 0, g: 0 };
  const next = ms.find((m) => !m.played);

  const calG = CALENDARIO.find((g) => g.partite.some((p) => p.casa === MIA || p.ospite === MIA));
  
  return `
    <div class="card hero">
      <div class="hero-top">
        ${badge(MIA, "lg")}
        <div>
          <div class="hero-name">${esc(t.nome)}</div>
          <div class="hero-sub">${pos}° Posto in Classifica · Serie C Gir 1</div>
        </div>
      </div>
      <div class="hero-stats">
        <div class="stat"><b>${pos}°</b><span>Posizione</span></div>
        <div class="stat"><b>${row.pt}</b><span>Punti</span></div>
        <div class="stat"><b>${row.g}</b><span>Giocate</span></div>
        <div class="stat"><b>19</b><span>Partite/G</span></div>
      </div>
      ${next ? `<div class="next">${ic("calendario")}<div><span class="muted">Prossima Partita (${ord(next.giornata)})</span><b>${next.casa === MIA ? "VS " : "@ "}${esc(TEAM[next.casa === MIA ? next.ospite : next.casa].nome)}</b><span>${fmtLungo(next.data)}</span></div></div>` : ""}
    </div>
    <div class="sec-label">Partite del Bar Angeli</div>
    ${ms.map(mcard).join("")}
  `;
}

// Vista Giocatori
function viewGiocatori() {
  return `
    <div class="sec-label">Rosa Ufficiale Bar Angeli 26/27</div>
    <div class="card">
      <table class="tbl">
        <thead><tr><th>#</th><th class="l">Giocatore</th><th>Squadra</th></tr></thead>
        <tbody>
          ${ROSA.map((p, i) => `
            <tr>
              <td class="pos">${i + 1}</td>
              <td class="l pname"><span class="plink">${esc(p.nome)}</span></td>
              <td><span class="badge xs" style="--c:#e61c24">BA</span></td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

// Vista Calendario
function viewCalendario() {
  if (state.giornata == null) state.giornata = 1;
  const g = state.giornata;
  const idx = GIORNATE.indexOf(g);
  const infoG = CALENDARIO.find((x) => x.giornata === g);
  const ms = MATCHES.filter((m) => m.giornata === g).map(info);

  return `
    <div class="gsel">
      <button data-step="-1" ${idx <= 0 ? "disabled" : ""}>${ic("left")}</button>
      <select id="sel-giornata">${GIORNATE.map((n) => `<option value="${n}" ${n === g ? "selected" : ""}>${ord(n)}</option>`).join("")}</select>
      <button data-step="1" ${idx >= GIORNATE.length - 1 ? "disabled" : ""}>${ic("right")}</button>
    </div>
    ${infoG?.riposa ? `<div class="banner demo" style="margin-bottom:12px"><b>Squadra che riposa:</b> ${esc(TEAM[infoG.riposa]?.nome)}</div>` : ""}
    <div class="card group">${ms.map((m) => matchRow(m)).join("")}</div>
  `;
}

// Vista Classifica
function viewClassifica() {
  const cl = classifica();
  return `
    <div class="sec-label">Classifica Ufficiale Serie C Gir 1</div>
    <div class="card">
      <table class="tbl">
        <thead><tr><th>Pos</th><th class="l">Squadra</th><th>PT</th><th>G</th></tr></thead>
        <tbody>
          ${cl.map((r, i) => `
            <tr class="${r.id === MIA ? "mine" : ""}">
              <td class="pos">${i + 1}</td>
              <td class="l team"><div class="tcell">${badge(r.id, "xs")}${tname(r.id)}</div></td>
              <td class="strong">${r.pt}</td>
              <td>${r.g}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

// Work in Progress Component per Coppa Italia e Regolamento
function viewWIP(title, subtitle) {
  return `
    <div class="card wip-container">
      <div class="wip-icon-wrap">
        <div class="wip-trophy">${ic("trophy")}</div>
        <div class="wip-gear">${ic("gear")}</div>
        <div class="wip-gear-2">${ic("gear")}</div>
      </div>
      <div class="wip-title">${title}</div>
      <div class="wip-sub">${subtitle}</div>
      <div class="wip-badge">Work In Progress</div>
    </div>
  `;
}

// Rendering Navigazione
const TAB_LABEL = { squadra: "Bar Angeli", giocatori: "Giocatori", calendario: "Calendario", classifica: "Classifica", coppa: "Coppa Italia", regolamento: "Regolamento" };
const TAB_ICON = { squadra: "squadra", giocatori: "giocatori", calendario: "calendario", classifica: "classifica", coppa: "coppa", regolamento: "regolamento" };

function renderTabs() {
  $("#tabs").innerHTML = VIEWS.map((v) =>
    `<button class="tab ${state.view === v ? "active" : ""}" data-nav="${v}">${ic(TAB_ICON[v])}<span>${esc(TAB_LABEL[v])}</span></button>`
  ).join("");
}

function renderBanner() {
  const parts = [];
  if (state.installPrompt) {
    parts.push(`<div class="banner install"><img src="${document.querySelector("link[rel='icon']").href}" alt=""><span class="grow"><b>Installa Bar Angeli 26/27</b> per un accesso rapido dal tuo smartphone Android.</span><button class="btn-install" data-action="install">Installa</button></div>`);
  }
  if (state.user) {
    parts.push(`<div class="banner admin">${ic("unlock")}<span class="grow">Modalità Inserimento Attiva</span><button data-action="logout">Esci</button></div>`);
  }
  $("#banner").innerHTML = parts.join("");
}

function render() {
  renderTabs();
  renderBanner();
  $("#btn-admin").classList.toggle("on", !!state.user);
  $("#btn-admin").innerHTML = ic(state.user ? "unlock" : "lock");

  const main = $("#app");
  if (state.view === "squadra") main.innerHTML = viewSquadra();
  else if (state.view === "giocatori") main.innerHTML = viewGiocatori();
  else if (state.view === "calendario") main.innerHTML = viewCalendario();
  else if (state.view === "classifica") main.innerHTML = viewClassifica();
  else if (state.view === "coppa") main.innerHTML = viewWIP("Coppa Italia", "La sezione dedicata alla Coppa Italia e ai suoi accoppiamenti sarà disponibile a breve.");
  else if (state.view === "regolamento") main.innerHTML = viewWIP("Regolamento 26/27", "Il regolamento aggiornato del campionato Serie C Gir 1 è attualmente in fase di pubblicazione.");
}

// Modali & Azioni
function openModal(html) {
  $("#modal-root").innerHTML = `<div class="overlay" data-overlay><div class="sheet">${html}</div></div>`;
}
const closeModal = () => { $("#modal-root").innerHTML = ""; };
const sheetHead = (title) => `<div class="sheet-head"><h3>${title}</h3><button class="icon-btn" data-action="close">${ic("close")}</button></div>`;

function openLogin() {
  openModal(`
    ${sheetHead("Area Riservata")}
    <form id="f-login">
      <div class="field">Password di Inserimento<input type="password" id="pwd" placeholder="Password" required></div>
      <div class="err" id="login-err"></div>
      <div class="btns"><button class="btn primary" type="submit">Accedi</button></div>
    </form>`);
}

function openEdit(id) {
  const m = info(MATCHES.find((x) => x.id === id));
  const real = state.risultati[id] || {};

  // Form a 19 Partite (18 regolamentari + 19ª VOLO)
  openModal(`
    ${sheetHead(`${ord(m.giornata)} - Inserimento Risultato`)}
    <form id="f-edit" data-id="${id}">
      <div class="field">Data Incontro<input type="date" name="data" value="${esc(m.data)}"></div>
      
      <div class="pblock">
        <div class="pblock-title">Punteggio Totale Incontro (19 Partite)</div>
        <div class="row">
          <label class="field">Punti ${esc(TEAM[m.casa].nome)}<input type="number" name="vc" min="0" max="19" value="${real.vintiCasa ?? 0}"></label>
          <label class="field">Punti ${esc(TEAM[m.ospite].nome)}<input type="number" name="vo" min="0" max="19" value="${real.vintiOspite ?? 0}"></label>
        </div>
      </div>

      <div class="pblock volo-block">
        <div class="pblock-title"><span>19ª Partita: <span class="badge-volo">VOLO</span></span></div>
        <div class="field">
          <span>Vincitore partita VOLO</span>
          <select name="volo_winner">
            <option value="">Seleziona Vincitore VOLO</option>
            <option value="${m.casa}" ${real.voloWinner === m.casa ? "selected" : ""}>${esc(TEAM[m.casa].nome)}</option>
            <option value="${m.ospite}" ${real.voloWinner === m.ospite ? "selected" : ""}>${esc(TEAM[m.ospite].nome)}</option>
          </select>
        </div>
      </div>

      <div class="btns">
        <button type="button" class="btn" data-action="close">Annulla</button>
        <button type="submit" class="btn primary">Salva Risultato</button>
      </div>
    </form>
  `);
}

async function saveEdit(form) {
  const id = form.dataset.id;
  const fd = new FormData(form);
  const payload = {
    data: fd.get("data"),
    vintiCasa: Number(fd.get("vc") || 0),
    vintiOspite: Number(fd.get("vo") || 0),
    voloWinner: fd.get("volo_winner") || null
  };

  if (state.fb) {
    try {
      const { fs, db } = state.fb;
      await fs.setDoc(fs.doc(db, "risultati", id), payload);
      closeModal();
      toast("Risultato registrato");
    } catch (e) {
      console.error(e);
    }
  } else {
    state.risultati[id] = payload;
    closeModal();
    render();
    toast("Risultato salvato in locale");
  }
}

// Toast Notification
let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
}

// Listener Eventi
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action],[data-nav],[data-step],[data-edit],#btn-admin");
  if (!el) return;
  const d = el.dataset;

  if (d.action === "close") closeModal();
  if (d.action === "logout") { state.user = false; render(); toast("Logout effettuato"); }
  if (d.action === "install" && state.installPrompt) {
    state.installPrompt.prompt();
    state.installPrompt = null;
    render();
  }
  if (d.nav) { state.view = d.nav; render(); window.scrollTo(0, 0); }
  if (d.step) {
    const idx = GIORNATE.indexOf(state.giornata) + Number(d.step);
    if (idx >= 0 && idx < GIORNATE.length) { state.giornata = GIORNATE[idx]; render(); }
  }
  if (d.edit) openEdit(d.edit);
  if (el.id === "btn-admin") state.user ? openAccount() : openLogin();
});

document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "f-login") {
    if ($("#pwd").value === CONFIG.password) {
      state.user = true;
      closeModal();
      render();
      toast("Accesso Inserimento Effettuato");
    } else {
      $("#login-err").textContent = "Password errata";
    }
  }
  if (e.target.id === "f-edit") saveEdit(e.target);
});

document.addEventListener("change", (e) => {
  if (e.target.id === "sel-giornata") {
    state.giornata = Number(e.target.value);
    render();
  }
});

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  state.installPrompt = e;
  render();
});

// Inizializzazione Firebase
async function initFirebase() {
  try {
    const base = `https://www.gstatic.com/firebasejs/10.12.2/`;
    const [appM, fs] = await Promise.all([
      import(base + "firebase-app.js"),
      import(base + "firebase-firestore.js"),
    ]);
    const app = appM.initializeApp(firebaseConfig);
    const db = fs.getFirestore(app);
    state.fb = { db, fs };

    fs.onSnapshot(fs.collection(db, "risultati"), (snap) => {
      const r = {};
      snap.forEach((doc) => { r[doc.id] = doc.data(); });
      state.risultati = r;
      render();
    });
  } catch (e) {
    console.warn("Firebase offline/non configurato:", e);
  }
}

// Startup
render();
initFirebase();
</script>
</body>
